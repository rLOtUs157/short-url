# ===== 数据库：MySQL（新建库 shorturl）=====
spring.datasource.url=jdbc:mysql://localhost:3306/shorturl?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Redis =====
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms

# ===== 服务端口 =====
server.port=8081

# ===== 短链业务参数 =====
short-url.base-url=http://localhost:8081/s/

# ===== JWT =====
# 签名密钥：至少 32 字节（HS256）。生产环境请改用环境变量覆盖，例如
#   set JWT_SECRET=xxxx  然后把下面这行写成 jwt.secret=${JWT_SECRET}
jwt.secret=short-url-secret-key-please-change-in-prod-0123
# token 有效期（毫秒），默认 24 小时
jwt.expire-ms=86400000
